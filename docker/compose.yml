name: soccer-scouting-app

services:
  php:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: soccer_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../laravel:/var/www/html
      - php_vendor:/var/www/html/vendor
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
             php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - mariadb
    networks:
      - app

  vite:
    image: node:22-alpine
    container_name: soccer_vite
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      WAYFINDER_COMMAND: "echo 'wayfinder: types generated by php container'"
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../laravel:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - app

  mariadb:
    image: mariadb:11
    container_name: soccer_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: laravel
      MARIADB_DATABASE: laravel
      MARIADB_USER: laravel
      MARIADB_PASSWORD: laravel
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - app

  mailpit:
    image: axllent/mailpit:latest
    container_name: soccer_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  mariadb_data:
  php_vendor:
  node_modules: